definitions:
  database.GetSkillsByNameRow:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  database.GetSkillsNotOwnedByUserRow:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  main.CustomQuest:
    properties:
      completed:
        type: boolean
      end_date:
        type: string
      experience:
        type: integer
      id:
        type: integer
      name:
        type: string
      skills:
        items:
          $ref: '#/definitions/main.QuestsSkills'
        type: array
      start_date:
        type: string
      subQuests:
        items:
          $ref: '#/definitions/main.RepeatingQuest'
        type: array
      subQuestsCompleted:
        type: integer
      type:
        type: string
    required:
    - type
    type: object
  main.LinkedSkill:
    properties:
      id:
        type: integer
      name:
        type: string
    required:
    - name
    type: object
  main.LoginBody:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  main.LoginResponse:
    properties:
      code:
        type: string
      redirect:
        type: string
    type: object
  main.PlayerInfoResponse:
    properties:
      experience:
        type: integer
      experienceNeeded:
        type: integer
      hotStreak:
        type: integer
      level:
        type: integer
      name:
        type: string
    type: object
  main.ProfileCreationBody:
    properties:
      bio:
        type: string
      dateOfBirth:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      nickName:
        type: string
      quests:
        items:
          $ref: '#/definitions/main.QuestsCreation'
        type: array
      skills:
        items:
          $ref: '#/definitions/main.SkillsCreation'
        type: array
    type: object
  main.ProfileResponse:
    properties:
      dateOfBirth:
        type: string
      email:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      nickName:
        type: string
    required:
    - email
    - firstName
    - lastName
    - nickName
    type: object
  main.QuestCompletionResponse:
    properties:
      leveledUpTimes:
        type: integer
    type: object
  main.QuestCreationPayload:
    properties:
      endDate:
        type: string
      experience:
        type: integer
      id:
        type: integer
      name:
        type: string
      skills:
        items:
          $ref: '#/definitions/main.SkillCreationPayload'
        type: array
      startDate:
        type: string
      subQuests:
        items:
          $ref: '#/definitions/main.RepeatingQuest'
        type: array
      type:
        type: string
    type: object
  main.QuestStatsResponse:
    properties:
      customQuestCompleted:
        type: integer
      experienceGained:
        type: integer
      questCompleted:
        type: integer
      repeatingQuestCompleted:
        type: integer
      subQuestsCompleted:
        type: integer
    type: object
  main.QuestsCreation:
    properties:
      experience:
        type: integer
      name:
        type: string
    type: object
  main.QuestsReponse:
    properties:
      customQuests:
        items:
          $ref: '#/definitions/main.CustomQuest'
        type: array
      repeatingQuests:
        items:
          $ref: '#/definitions/main.TypeRepeatingQuest'
        type: array
    type: object
  main.QuestsSkills:
    properties:
      id:
        type: integer
      name:
        type: string
    required:
    - id
    - name
    type: object
  main.RepeatingQuest:
    properties:
      completed:
        type: boolean
      experience:
        type: integer
      id:
        type: integer
      name:
        type: string
      skills:
        items:
          $ref: '#/definitions/main.QuestsSkills'
        type: array
      subQuests:
        items:
          $ref: '#/definitions/main.RepeatingQuest'
        type: array
      subQuestsCompleted:
        type: integer
      type:
        type: string
    required:
    - type
    type: object
  main.Skill:
    properties:
      experience:
        type: integer
      experienceNeeded:
        type: integer
      id:
        type: integer
      level:
        type: integer
      linkedSkills:
        items:
          $ref: '#/definitions/main.LinkedSkill'
        type: array
      name:
        type: string
    required:
    - name
    type: object
  main.SkillCreationPayload:
    properties:
      id:
        type: integer
      isNew:
        type: boolean
      linkedSkills:
        items:
          $ref: '#/definitions/main.LinkedSkill'
        type: array
      name:
        type: string
    required:
    - name
    type: object
  main.SkillExclude:
    properties:
      id:
        type: integer
      linkedSkills:
        items:
          $ref: '#/definitions/main.LinkedSkill'
        type: array
      name:
        type: string
    required:
    - id
    - name
    type: object
  main.SkillsCreation:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  main.SkillsExcludeResponse:
    properties:
      skills:
        items:
          $ref: '#/definitions/main.SkillExclude'
        type: array
    type: object
  main.SkillsNotOwnedResponse:
    properties:
      skills:
        items:
          $ref: '#/definitions/database.GetSkillsNotOwnedByUserRow'
        type: array
    type: object
  main.SkillsResponse:
    properties:
      skills:
        items:
          $ref: '#/definitions/database.GetSkillsByNameRow'
        type: array
    type: object
  main.TypeRepeatingQuest:
    properties:
      quests:
        items:
          $ref: '#/definitions/main.RepeatingQuest'
        type: array
      type:
        type: string
    required:
    - type
    type: object
  main.UpdateUserBody:
    properties:
      bio:
        type: string
      dateOfBirth:
        type: string
      email:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      nickName:
        type: string
      target:
        type: string
    required:
    - target
    type: object
  main.UserResponse:
    properties:
      bio:
        type: string
      highestLeveledSkill:
        type: string
      mostRecentLeveledSkill:
        type: string
      profile:
        $ref: '#/definitions/main.ProfileResponse'
      questStats:
        $ref: '#/definitions/main.QuestStatsResponse'
    required:
    - profile
    type: object
  main.UsersSkillsResponse:
    properties:
      skills:
        items:
          $ref: '#/definitions/main.Skill'
        type: array
    type: object
host: localhost:8080
info:
  contact: {}
  description: API for Level-Up app
  title: Level-Up API
  version: "0.1"
paths:
  /v1/levelup_api/create-skill:
    post:
      consumes:
      - application/json
      description: create skill for user
      parameters:
      - description: Skill creation
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.SkillCreationPayload'
      responses:
        "200":
          description: OK
      summary: Create skill
      tags:
      - Skills
  /v1/levelup_api/createProfile:
    post:
      consumes:
      - application/json
      description: Create the player with user's info, skills and quests
      parameters:
      - description: Profile creation payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.ProfileCreationBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.LoginResponse'
      summary: Create the player
      tags:
      - Player
  /v1/levelup_api/logIn:
    post:
      consumes:
      - application/json
      description: take the email and the password, hash the password, check for user
        and login
      parameters:
      - description: Login payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.LoginBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.LoginResponse'
      summary: Log In the user
      tags:
      - Login
  /v1/levelup_api/quests:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.QuestsReponse'
      summary: Get all quests for the user
      tags:
      - Quests
  /v1/levelup_api/signUp:
    post:
      consumes:
      - application/json
      description: take the email and the password, hash the password, create the
        user and make cookies
      parameters:
      - description: SignUp payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.LoginBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.LoginResponse'
      summary: Sign up the user
      tags:
      - Login
  /v1/levelup_api/skill/{id}/deactivate:
    delete:
      description: deactivate the skill
      parameters:
      - description: Id of the skill
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
      summary: Deactivate
      tags:
      - Skills
  /v1/levelup_api/skills:
    get:
      description: get skills, limited to 200 results
      parameters:
      - description: Get skills with the typed in prefix
        in: query
        name: name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.SkillsResponse'
      summary: Get skills from database
      tags:
      - Skills
  /v1/levelup_api/skills-not-user:
    get:
      description: get skills not owned by the user, limited to 200 results
      parameters:
      - description: Get skills with the typed in prefix and not owned by current
          user
        in: query
        name: name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.SkillsNotOwnedResponse'
      summary: Get skills from database
      tags:
      - Skills
  /v1/levelup_api/updateUser:
    post:
      consumes:
      - application/json
      description: Update the player
      parameters:
      - description: User update payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.UpdateUserBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Update the player
      tags:
      - Player
  /v1/levelup_api/user/info:
    get:
      description: Get info for the header
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.PlayerInfoResponse'
      summary: Get player info
      tags:
      - Player
  /v1/levelup_api/user/quest-creation:
    post:
      consumes:
      - application/json
      parameters:
      - description: Skill creation
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.QuestCreationPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Get all quests for the user
      tags:
      - Quests
  /v1/levelup_api/user/quest/{id}/complete:
    post:
      parameters:
      - description: ID of the quest
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.QuestCompletionResponse'
      summary: Complete a sub-quest
      tags:
      - Quests
  /v1/levelup_api/user/quest/{id}/complete-subquest:
    post:
      parameters:
      - description: ID of the quest
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.QuestCompletionResponse'
      summary: Complete a sub-quest
      tags:
      - Quests
  /v1/levelup_api/user/quest/{id}/delete-subquest:
    delete:
      parameters:
      - description: ID of the quest
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
      summary: Delete a sub-quest
      tags:
      - Quests
  /v1/levelup_api/user/skills:
    get:
      description: get user's skills
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.UsersSkillsResponse'
      summary: Get user's skills from database
      tags:
      - Skills
  /v1/levelup_api/user/skills_exclude:
    get:
      description: get user's skills
      parameters:
      - description: Get skills with the typed in prefix
        in: query
        name: name
        type: string
      - collectionFormat: csv
        description: Exclude skills
        in: query
        items:
          type: integer
        name: exclude_ids
        type: array
      - description: Exclude given skill
        in: query
        name: excludeName
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.SkillsExcludeResponse'
      summary: Get user's skills from database
      tags:
      - Skills
  /v1/levelup_api/userProfile:
    get:
      description: Get everything about the player
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.UserResponse'
      summary: Get the player
      tags:
      - Player
swagger: "2.0"
