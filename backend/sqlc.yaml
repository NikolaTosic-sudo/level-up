version: "2"
sql:
  - schema: "sql/schema"
    queries: "sql/queries"
    engine: "postgresql"
    gen:
      go:
        out: "internal/database"
        emit_json_tags: true
        sql_package: pgx/v5
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"

          - db_type: "pg_catalog.timestamp"
            go_type:
              import: "time"
              type: "Time"

          - db_type: "pg_catalog.timestamptz"
            go_type:
              import: "time"
              type: "Time"

          - db_type: "pg_catalog.date"
            go_type:
              import: "time"
              type: "Time"
